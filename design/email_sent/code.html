<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple animation for the container entrance
            const container = document.querySelector('.bg-surface-container-lowest');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);

            // Interaction for the primary button
            const mainBtn = document.querySelector('button');
            mainBtn.addEventListener('mousedown', () => {
                mainBtn.classList.add('scale-95');
            });
            mainBtn.addEventListener('mouseup', () => {
                mainBtn.classList.remove('scale-95');
            });
        });
    </script>
