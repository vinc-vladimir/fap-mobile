<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<main class="relative z-10 flex-grow flex flex-col px-margin-main pb-stack-lg pt-[50vh]">
<section class="fixed top-0 left-0 w-full z-0 overflow-hidden h-[60vh]">
<div class="absolute inset-0 z-0">
<img alt="Futuristic electric car being serviced by robotic arms in a high-tech white charging station." class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLvMWQclHkX70K2GSNxbwJ-uZMm68Phzs3wZtgWZl0ZMjJhKvm_G_FnBaoNKmwZ92-7fMtbiKxVf9n3TDoQv37r0xvDIXowDQRJg_zCDCVcFAVVRjCBH5iUE5_-hKharJKkPCt1xJvO9BHpQehBdiIbcFKPx5mZbiK7_CktXqtLSoaAwce1_fvoA4YLfaDwvKrKUbgvst3Rpv2PFsKK1E1KIU40ttwlsaycmXw3Edsp4IMvDQXyT5i1ISwYlgre8Dp3d29acPb9fwA">
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-surface/50 to-surface"></div>
</div>
</section>
<section class="relative -mt-10 flex-grow z-20">
<div class="bg-surface-container-lowest rounded-lg shadow-xl min-h-[55vh] px-margin-main pb-8 flex flex-col py-4">
<div class="max-w-md mx-auto w-full">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Forgot Password?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg leading-relaxed">Don't worry, it happens to all of us... just enter your email below and we'll help you get back on the road.</p>
<form class="space-y-stack-lg">
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-on-surface" id="email" placeholder="name@velocity.com" type="email">
</div>
</div>
<button class="w-full bg-vibrant-cyan font-headline-sm text-headline-sm py-4 rounded-lg shadow-lg active:scale-[0.98] transition-all hover:opacity-90 tracking-wide uppercase text-primary" type="button">RESET PASSWORD</button>
</form>
</div>
</div>
</section>
</main>
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
