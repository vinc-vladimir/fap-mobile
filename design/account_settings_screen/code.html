<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00f5ff;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #00f5ff;
        }
        
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;

<body class="bg-[#0B101A] text-on-background font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TOP APP BAR -->
<header class="bg-[#0B101A] text-[#00F5FF] font-inter font-semibold text-lg tracking-tight docked full-width top-0 border-b border-white/10 flat no shadows flex justify-between items-center w-full px-5 py-4 max-w-none sticky z-40">
<button aria-label="Go back" class="hover:opacity-80 transition-opacity active:scale-98 transition-transform duration-200 flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-black text-[#00F5FF] tracking-tighter">Settings</h1>
<!-- Empty placeholder to balance flex layout -->
<div class="w-10 h-10"></div>
</header>
<!-- MAIN CONTENT -->
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-main py-stack-lg flex flex-col gap-stack-lg">
<!-- PREFERENCES SECTION -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-slate-400 uppercase tracking-widest pl-2">Preferences</h2>
<div class="bg-[#1A2130] rounded-xl border border-white/10 shadow-[0_8px_24px_rgba(0,245,255,0.02)] overflow-hidden">
<!-- Language -->
<div class="flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors cursor-pointer active:scale-[0.99]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#0B101A] flex items-center justify-center text-[#00F5FF]">
<span class="material-symbols-outlined" data-icon="language">language</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Language</span>
</div>
<div class="flex items-center gap-2 text-slate-400">
<div class="flex items-center gap-2 bg-[#0B101A] px-3 py-1.5 rounded-lg border border-white/5">
<span class="text-xl leading-none">🇬🇧</span>
<span class="font-body-sm text-body-sm">English</span>
</div>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Theme Toggle -->
<div class="flex items-center justify-between p-4 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#0B101A] flex items-center justify-center text-[#00F5FF]">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Dark Mode</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#00f5ff] checked:bg-surface-container-lowest transition-transform duration-200" id="toggle" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-[#00f5ff] cursor-pointer" for="toggle"></label>
</div>
</div>
</div>
</section>
<!-- SECURITY SECTION -->
<section class="flex flex-col gap-stack-sm mt-4">
<h2 class="font-label-md text-label-md text-slate-400 uppercase tracking-widest pl-2">Security</h2>
<div class="bg-[#1A2130] rounded-xl border border-white/10 shadow-[0_8px_24px_rgba(0,245,255,0.02)] overflow-hidden">
<!-- Change Email -->
<button class="w-full flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors active:scale-[0.99] text-left">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#0B101A] flex items-center justify-center text-[#00F5FF]">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Change Email</span>
<span class="font-body-sm text-body-sm text-slate-400">user@example.com</span>
</div>
</div>
<span class="material-symbols-outlined text-slate-400" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Change Password -->
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors active:scale-[0.99] text-left">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#0B101A] flex items-center justify-center text-[#00F5FF]">
<span class="material-symbols-outlined" data-icon="key">key</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Change Password</span>
<span class="font-body-sm text-body-sm text-slate-400">Last updated 3 months ago</span>
</div>
</div>
<span class="material-symbols-outlined text-slate-400" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- ACCOUNT MANAGEMENT SECTION -->
<section class="flex flex-col gap-stack-sm mt-4 mb-8">
<h2 class="font-label-md text-label-md text-slate-400 uppercase tracking-widest pl-2">Account Management</h2>
<div class="bg-[#1A2130] rounded-xl border border-white/10 shadow-[0_8px_24px_rgba(0,245,255,0.02)] overflow-hidden">
<!-- Delete Account -->
<button class="w-full flex items-center justify-between p-4 hover:bg-error/10 transition-colors active:scale-[0.99] text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-error/10 group-hover:bg-error/20 flex items-center justify-center text-error transition-colors">
<span class="material-symbols-outlined" data-icon="delete_forever">delete_forever</span>
</div>
<span class="font-body-md text-body-md text-error font-medium">Delete Account</span>
</div>
<span class="material-symbols-outlined text-error/50 group-hover:text-error transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
</main>

<span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
<span class="">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 opacity-70 gap-1 w-16" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="map">map</span>

</a>
<a class="flex flex-col items-center justify-center text-slate-500 opacity-70 gap-1 w-16" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="payments">payments</span>
<span class="">Wallet</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 opacity-70 gap-1 w-16" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="history">history</span>
<span class="">Activity</span>
</a>
<a class="flex flex-col items-center justify-center text-[#00F5FF] bg-cyan-500/10 rounded-xl px-3 py-1 gap-1 w-16" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="">Account</span>
</a></nav>

<nav class="flex flex-col gap-2"><a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-400 hover:text-[#00F5FF] hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-body-md text-body-md font-medium">Home</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-400 hover:text-[#00F5FF] hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-body-md text-body-md font-medium">Map</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-400 hover:text-[#00F5FF] hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-body-md text-body-md font-medium">Wallet</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-400 hover:text-[#00F5FF] hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-body-md text-body-md font-medium">Activity</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-[#00F5FF] bg-cyan-500/10 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-body-md text-body-md font-medium">Account</span>
</a></nav>

</body></html>
