<!-- Micro-interactions Script -->
<script>
        // Subtle mouse parallax effect for the background
        document.addEventListener('mousemove', (e) => {
            const hero = document.querySelector('.hero-gradient').previousElementSibling;
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;
            
            hero.style.transform = `scale(1.1) translate(${mouseX * 20}px, ${mouseY * 20}px)`;
        });

        // Input focus styles
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#00f5ff';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '';
            });
        });
    </script>
