<script>
        // Subtle parallax effect for the background
        document.addEventListener('mousemove', (e) => {
            const hero = document.querySelector('.hero-gradient').previousElementSibling;
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;
            hero.style.transform = `scale(1.1) translate(${mouseX * 15}px, ${mouseY * 15}px)`;
        });

        // Input focus styling for icons
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.style.color = '#00696e';
            });
            input.addEventListener('blur', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.style.color = '';
            });
        });
    </script>
